apiVersion: v1
kind: ConfigMap
metadata:
  name: python-app-code
data:
  app.py: |
    import os, time

    def load_secrets():
        secrets_file = '/vault/secrets/database-config.txt'
        if os.path.exists(secrets_file):
            with open(secrets_file, 'r') as f:
                print(content := f.read()[:50] + "...")
                return True
        return False

    while True:
        if load_secrets():
            print("Running with secrets...")
        else:
            print("Running without secrets...")
        time.sleep(30)
